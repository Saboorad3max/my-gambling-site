<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Coins Gambling & Shop</title>
  <style>
    /* --- BASE RESET --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f17;
      color: #e5e7eb;
      padding: 12px;
      min-height: 100vh;
    }

    #app-container, #auth-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* --- HEADER & TOP BAR --- */
    header, .top-bar, .navbar {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .logo-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .user-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #1f2937;
    }

    .user-details {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .username-text {
      font-weight: 600;
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .badge {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    /* --- BUTTONS & INPUTS --- */
    button, .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    #btn-logout, .btn-danger {
      background: #ef4444;
      color: #ffffff;
    }

    input[type="text"], input[type="password"], input[type="number"], .coin-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .auth-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
    }

    /* --- NAVIGATION TABS --- */
    .tabs-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: #111827;
      color: #9ca3af;
      border: 1px solid #1f2937;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }

    /* --- CONTENT CONTAINERS & CARDS --- */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: #9ca3af;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .game-card {
      position: relative;
      background: linear-gradient(145deg, #1f2937, #111827);
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 120px;
      cursor: pointer;
      text-align: center;
    }

    .game-card:hover {
      border-color: #3b82f6;
    }

    .card-badge {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #2563eb;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      text-align: center;
      padding: 3px 0;
      text-transform: uppercase;
    }

    .card-icon {
      font-size: 2.5rem;
      line-height: 1;
      margin-top: 10px;
    }

    .card-title {
      font-weight: 800;
      font-size: 0.9rem;
      color: #fff;
    }

    .btn-back {
      background: #1f2937;
      color: #9ca3af;
      border: 1px solid #374151;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      width: fit-content;
    }

    .game-container {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .chat-container {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-box {
      height: 220px;
      background: #0b0f17;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-input-box {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .text-green { color: #10b981; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-container" class="auth-card">
    <h2>Welcome to Virtual Coins</h2>
    <input type="email" id="auth-email" class="coin-input" placeholder="Email (Admin: saboorezz@gmail.com)" autocomplete="off">
    <input type="text" id="auth-username" class="coin-input" placeholder="Username" autocomplete="off">
    <input type="password" id="auth-password" class="coin-input" placeholder="Password" autocomplete="off">
    <div class="auth-buttons">
      <button id="btn-login" style="flex:1;">Login</button>
      <button id="btn-signup" class="btn-secondary" style="background:#374151; color:#fff; flex:1;">Sign Up</button>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="hidden">
    <header class="navbar">
      <div class="logo-title">🎲 Virtual Coins</div>
      <div class="user-info">
        <div class="user-details">
          <span id="display-user" class="username-text"></span>
          <span class="badge">Coins: <strong id="display-balance">755</strong></span>
        </div>
        <button id="btn-logout" class="btn-danger">Logout</button>
      </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="tabs-nav">
      <button class="tab-btn active" data-tab="tab-games">Games</button>
      <button class="tab-btn" data-tab="tab-milestones">Milestones</button>
      <button class="tab-btn" data-tab="tab-store">Store & Withdraw</button>
      <button class="tab-btn" data-tab="tab-chat">Live Chat</button>
      <button class="tab-btn admin-only hidden" data-tab="tab-admin">Admin Panel</button>
    </nav>

    <!-- GAMES TAB -->
    <section id="tab-games" class="tab-content active">
      <div id="games-lobby">
        <h3 class="section-title">Original Games</h3>
        <div class="games-grid">
          <div class="game-card" onclick="alert('Launching Coinflip game!')">
            <div class="card-badge">ORIGINAL</div>
            <div class="card-icon">🪙</div>
            <div class="card-title">COINFLIP</div>
          </div>
          <div class="game-card" onclick="alert('Launching Dice game!')">
            <div class="card-badge">ORIGINAL</div>
            <div class="card-icon">🎲</div>
            <div class="card-title">DICE</div>
          </div>
        </div>
      </div>
    </section>

    <!-- MILESTONES TAB -->
    <section id="tab-milestones" class="tab-content">
      <h2 class="panel-title">3-Day Wager Milestones</h2>
      <p style="color: #9ca3af; font-size: 0.85rem;">Wager coins to unlock milestone rewards.</p>
    </section>

    <!-- STORE TAB -->
    <section id="tab-store" class="tab-content">
      <h2 class="panel-title">Withdraw Coins for Rewards</h2>
    </section>

    <!-- CHAT TAB -->
    <section id="tab-chat" class="tab-content">
      <div class="chat-container">
        <h2 class="panel-title">Global Chat</h2>
        <div id="chat-messages" class="chat-box">
          <div style="background:#1f2937; padding:8px; border-radius:6px; font-size:0.9rem;">Welcome to the chat!</div>
        </div>
        <div class="chat-input-box">
          <input type="text" id="chat-input" class="coin-input" placeholder="Type a message...">
          <button onclick="alert('Message sent!')">Send</button>
        </div>
      </div>
    </section>

    <!-- ADMIN TAB -->
    <section id="tab-admin" class="tab-content">
      <h2 class="panel-title">Admin Control Panel</h2>
      <p style="color: #9ca3af;">Admin controls active.</p>
    </section>
  </div>

  <script>
    // Tab switching controller
    document.querySelectorAll('.tab-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        button.classList.add('active');
        const targetTabId = button.getAttribute('data-tab');
        document.getElementById(targetTabId).classList.add('active');
      });
    });

    // Simple Authentication Mock for Testing UI
    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');

    document.getElementById('btn-login').addEventListener('click', () => {
      const email = document.getElementById('auth-email').value;
      const username = document.getElementById('auth-username').value || "Player";
      
      authContainer.classList.add('hidden');
      appContainer.classList.remove('hidden');
      document.getElementById('display-user').textContent = username;

      if (email === "saboorezz@gmail.com") {
        document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      appContainer.classList.add('hidden');
      authContainer.classList.remove('hidden');
    });
  </script>
</body>
</html>
