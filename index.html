<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Coins Gambling & Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH CONTAINER -->
  <div id="auth-container" class="card">
    <h2>Welcome to Virtual Coins</h2>
    <input type="email" id="auth-email" placeholder="Email (Admin: saboorezz@gmail.com)">
    <input type="text" id="auth-username" placeholder="Username">
    <input type="password" id="auth-password" placeholder="Password">
    <div class="auth-buttons">
      <button id="btn-login">Login</button>
      <button id="btn-signup" class="btn-secondary">Sign Up</button>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="hidden">
    <!-- NAVBAR -->
    <header class="navbar">
      <h1>🎲 Virtual Coins</h1>
      <div class="user-info">
        <span id="display-user"></span>
        <span class="badge">Coins: <strong id="display-balance">0</strong></span>
        <button id="btn-logout" class="btn-danger">Logout</button>
      </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="tab-games">Games</button>
      <button class="tab-btn" data-tab="tab-store">Store & Withdraw</button>
      <button class="tab-btn" data-tab="tab-chat">Live Chat</button>
      <button class="tab-btn admin-only hidden" data-tab="tab-admin">Admin Panel</button>
    </nav>

    <!-- GAMES SECTION -->
    <section id="tab-games" class="tab-content active">
      <h2>Coinflip Game</h2>
      <div class="game-box card">
        <input type="number" id="coinflip-bet" placeholder="Bet Amount" min="1">
        <div class="btn-group">
          <button id="btn-heads" onclick="playCoinflip('heads')">Flip Heads</button>
          <button id="btn-tails" onclick="playCoinflip('tails')">Flip Tails</button>
        </div>
        <p id="coinflip-result" class="game-result"></p>
      </div>
    </section>

    <!-- STORE SECTION -->
    <section id="tab-store" class="tab-content">
      <h2>Withdraw Coins for Rewards</h2>
      <div id="store-list" class="grid-container"></div>
    </section>

    <!-- LIVE CHAT SECTION -->
    <section id="tab-chat" class="tab-content">
      <h2>Global Chat</h2>
      <p class="chat-help">Tip someone by typing <strong>/tip</strong> in chat!</p>
      <div id="chat-messages" class="chat-box card"></div>
      <div class="chat-input-box">
        <input type="text" id="chat-input" placeholder="Type a message or /tip...">
        <button id="btn-send-chat">Send</button>
      </div>
    </section>

    <!-- ADMIN PANEL SECTION -->
    <section id="tab-admin" class="tab-content">
      <h2>Admin Control Panel</h2>
      
      <!-- STORE EDITING -->
      <div class="card">
        <h3>Update Store Items & Rates</h3>
        <div class="admin-store-inputs">
          <input type="text" id="new-item-name" placeholder="Item Name (e.g., Android phone per min)">
          <input type="number" id="new-item-cost" placeholder="Coin Cost (e.g., 7)">
          <button id="btn-add-item">Add / Update Item</button>
        </div>
      </div>

      <!-- USER MANAGEMENT & TIPPING -->
      <div class="card">
        <h3>User Balances & Add/Remove Coins</h3>
        <div id="admin-user-list"></div>
      </div>

      <!-- WITHDRAWAL REQUESTS -->
      <div class="card">
        <h3>Pending Withdrawal Requests</h3>
        <div id="admin-withdraw-list"></div>
      </div>
    </section>
  </div>

  <!-- TIP MODAL -->
  <div id="tip-modal" class="modal hidden">
    <div class="modal-content card">
      <h3>Tip Coins</h3>
      <input type="text" id="tip-recipient" placeholder="Recipient Username">
      <input type="number" id="tip-amount" placeholder="Amount to Tip">
      <div class="modal-actions">
        <button id="btn-confirm-tip">Send Tip</button>
        <button id="btn-close-tip" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module" src="app.js"></script>
</body>
</html>
